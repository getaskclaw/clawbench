name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck abs.sh
      - name: Run regression suite
        run: python3 -m unittest -v tests/test_abs.py
